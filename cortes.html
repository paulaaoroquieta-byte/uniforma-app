  --warn-bg:#4A2611; --warn-ink:#FFB685; --ok-ink:#7FDB9C; --danger:#FF7A6E; color-scheme:dark}

.panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}

.resumen{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:6px;align-items:center;margin-top:12px}
.rcol{background:var(--celeste-soft);border-radius:var(--r);padding:10px;text-align:center;min-width:0}
.rcol small{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rcol b{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.rcol.lib{background:var(--azul);color:var(--azul-ink)}.rcol.lib small{color:inherit;opacity:.85}
.rcol.corte{background:var(--corte)}.rcol.tot{background:var(--surface);border:2px solid var(--azul)}
.rcol.par{grid-column:1/4;background:var(--surface);border:1.5px dashed var(--muted)}
.rcol.bad,.rcol.good{grid-column:5/8}.rcol.bad{background:var(--warn-bg)}.rcol.bad b{color:var(--danger)}.rcol.good{background:var(--st-entregado)}.rcol.good b{color:var(--ok-ink)}
.rop{font-family:var(--display);font-weight:800;color:var(--muted)}
.tbl.t7 td,.tbl.t7 th{text-align:center}.tbl.t7 td:first-child,.tbl.t7 th:first-child{text-align:left}
.tbl td.par{background:var(--celeste-soft);font-weight:700}.tbl td.okc{color:var(--ok-ink);font-weight:700}
.tbl tr.tsum td{font-weight:800;border-top:2px solid var(--line);background:var(--bg)}
.pill.good{background:var(--st-entregado);color:var(--ok-ink)}
@media (max-width:560px){.resumen{grid-template-columns:1fr 1fr}.rop{display:none}.rcol.par{grid-column:1}.rcol.bad,.rcol.good{grid-column:2}.tbl.t7 th,.tbl.t7 td{padding:7px 5px;font-size:.82rem}.tbl.t7 th{font-size:.6rem;white-space:normal}}
.hbars{display:grid;gap:6px;margin-top:6px}
.hb{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) 34px;gap:8px;align-items:center;font-size:.88rem}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb i{display:block;height:12px;border-radius:99px;background:var(--niv)}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div class="wrap">
  <header class="top">
    <h1><a href="./" style="color:inherit;text-decoration:none" aria-label="Volver al inicio">‹</a> Cortes <span>Uniforma</span></h1>
    <div class="hright"><span class="sync" id="sync">Conectando…</span><button type="button" class="btn ghost small" id="btnCopia">⬇ Descargar copia de Excel</button></div>
  </header>
  <div id="backupNote"></div>
  <div class="clients" id="clients"></div>
  <div id="notice"></div>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <div class="seg" id="views"></div>
  </div>
  <div id="main"></div>
</div>
<button class="btn fab" id="fab" type="button">＋ Nuevo corte</button>
<div id="modal"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const CLIENTES={
  fatima:{nombre:"Fátima",stock:true,det:"Talle",productos:["Chomba Jardín","Chomba Primaria","Chomba Secundaria","Remera Gimnasia Jardín","Remera Gimnasia Primaria","Remera Gimnasia Secundaria","Campera Jardín","Campera Primaria","Campera Secundaria","Pantalón verano","Pantalón invierno","Short Pollera","Short Varón","Buzo Niño","Buzo Adulto","Camiseta Térmica"]},
  tecnica:{nombre:"Técnica",stock:true,det:"Talle",productos:["Chomba","Guardapolvo","Campera"]},
  floritas:{nombre:"Floritas",stock:false,det:"Color",productos:["Cambiador","Dona","Bolso","Muñeco"]},
  gastro:{nombre:"Gastronómico Z. Norte",stock:false,det:"Talle",libre:true,productos:[]},
  pedidos:{nombre:"Pedidos especiales",stock:false,det:"Talle / color",libre:true,conCliente:true,productos:[]}
};
const UBIC=[["nuestro","En nuestro taller"],["espera","Esperando para llevar a taller"],["taller","En taller"],["bordado","En bordado"],["ojales","En ojales"],["entregado","Entregado ✓"]];
const OBS=["Sin pendientes","Falta entrega de cuellos","Pendiente de bordado","Faltó tela","Falta completar corte","Falta otra cosa"];
const LUGARES={nuestro:["Nuestro taller"],taller:["ELU","Laura","Cristina","Mirta","Estela"],bordado:["Sergio (Borda Exprés)","Roxana (Bordados Ro)"],ojales:["Graciela","Yoli"]};
const TODOS=[...LUGARES.taller,...LUGARES.bordado,...LUGARES.ojales];
const lugaresDe=u=>LUGARES[u]||TODOS;
function tallerOpts(u,cur){const l=lugaresDe(u).slice();if(cur&&!l.includes(cur))l.push(cur);
  return `<option value="">— Elegí —</option>`+l.map(t=>`<option ${t===cur?"selected":""}>${esc(t)}</option>`).join("")+`<option value="__otro">Otro (escribir)…</option>`}
const TALLES=["2","4","6","8","10","12","14","16","S","M","L","XL","XXL"];
const uLabel=Object.fromEntries(UBIC);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$ "+Math.round(n||0).toLocaleString("es-AR");
const fdate=d=>d?d.split("-").reverse().join("/"):"";
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const qty=c=>(c.lineas||[]).reduce((a,l)=>a+(+l.c||0),0);

let state={cliente:"fatima",vista:"proceso"};
try{const s=JSON.parse(localStorage.getItem("cu-ui")||"{}");if(CLIENTES[s.cliente]||s.cliente==="balance")state.cliente=s.cliente;if(s.vista)state.vista=s.vista}catch(e){}
if(location.hash==="#stock-fatima"){state.cliente="fatima";state.vista="stock"}
let abrirLib=false;if(location.hash==="#llevar-libreria"){state.cliente="fatima";state.vista="stock";abrirLib=true}
const saveUI=()=>{try{localStorage.setItem("cu-ui",JSON.stringify(state))}catch(e){}};
let cortes=[],salidas=[],db=null,offline=false;

/* ---------- datos ---------- */
async function guardar(col,id,data){
  if(db){const ref=id?db.collection(col).doc(id):db.collection(col).doc();await ref.set(data);return}
  const arr=col==="cortes"?cortes:salidas;
  if(id){const i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]={...data,id};}else arr.push({...data,id:"l"+Date.now()});
  render();
}
async function borrar(col,id){
  if(db){await db.collection(col).doc(id).delete();return}
  if(col==="cortes")cortes=cortes.filter(x=>x.id!==id);else salidas=salidas.filter(x=>x.id!==id);render();
}
function setSync(t){$("#sync").textContent=t}

/* ---------- render ---------- */
function render(){
  const C=CLIENTES[state.cliente]||{};
  if(!C.stock&&state.vista==="stock")state.vista="proceso";
  $("#clients").innerHTML=Object.entries(CLIENTES).map(([k,v])=>`<button type="button" data-c="${k}" aria-pressed="${k===state.cliente}">${v.nombre}</button>`).join("")+`<button type="button" data-c="balance" aria-pressed="${state.cliente==="balance"}">📊 Balance</button>`;
  $("#notice").innerHTML=offline?`<div class="notice">No se pudo abrir el guardado del celular.</div>`:"";
  if(state.cliente==="balance"){$("#fab").hidden=true;$("#stats").innerHTML="";$("#views").parentNode.hidden=true;$("#main").innerHTML=renderBalance();return}
  $("#fab").hidden=false;$("#views").parentNode.hidden=false;
  const vistas=[["proceso","En proceso"],["entregados","Entregados"]].concat(C.stock?[["stock","Stock"]]:[]);
  $("#views").innerHTML=vistas.map(([k,v])=>`<button type="button" data-v="${k}" aria-pressed="${k===state.vista}">${v}</button>`).join("");
  $("#notice").innerHTML=offline?`<div class="notice">No se pudo abrir el guardado del celular.</div>`:"";
  const mine=cortes.filter(c=>c.cliente===state.cliente);
  const proc=mine.filter(c=>c.ubic!=="entregado"), ent=mine.filter(c=>c.ubic==="entregado");
  const pend=proc.filter(c=>c.obs&&c.obs!=="Sin pendientes").length;
  const enTaller=proc.filter(c=>["taller","bordado","ojales"].includes(c.ubic)).reduce((a,c)=>a+qty(c),0);
  const mes=today().slice(0,7);
  const pagMes=ent.filter(c=>(c.fechaEnt||"").startsWith(mes)).reduce((a,c)=>a+qty(c)*(+c.precio||0),0);
  $("#stats").innerHTML=`
    <div class="stat"><small>Cortes en proceso</small><b>${proc.length}</b></div>
    <div class="stat"><small>Prendas afuera</small><b>${enTaller}</b></div>
    <div class="stat"><small>Con pendientes</small><b>${pend}</b></div>
    <div class="stat"><small>Pagado este mes</small><b>${money(pagMes)}</b></div>`;
  const main=$("#main");
  if(state.vista==="stock"){main.innerHTML=renderStock(mine);return}
  const lista=(state.vista==="proceso"?proc:ent).slice().sort((a,b)=>(state.vista==="proceso"?(a.fecha||"").localeCompare(b.fecha||""):(b.fechaEnt||"").localeCompare(a.fechaEnt||"")));
  if(!lista.length){
    main.innerHTML=`<div class="list"><div class="empty"><b>${state.vista==="proceso"?"No hay cortes en proceso":"Todavía no hay cortes entregados"}</b>${state.vista==="proceso"?"Tocá “＋ Nuevo corte” para cargar el primero de "+C.nombre+".":"Cuando cambies un corte a “Entregado ✓” aparece acá con lo que pagaste."}</div></div>`;return}
  main.innerHTML=`<div class="list">${lista.map(card).join("")}</div>`;
}
function card(c){
  const C=CLIENTES[c.cliente], total=qty(c);
  const lines=(c.lineas||[]).filter(l=>l.t||l.c).map(l=>`<span class="chip">${C.det==="Talle"?"T ":""}<b>${esc(l.t)}</b> · ${esc(l.c)}</span>`).join("");
  const ops=UBIC.map(([k,v])=>`<option value="${k}" ${k===c.ubic?"selected":""}>${v}</option>`).join("");
  const obs=c.obs&&c.obs!=="Sin pendientes"?`<span class="tag warn">⚠ ${esc(c.obs)}${c.nota?": "+esc(c.nota):""}</span>`:(c.nota?`<span class="meta">${esc(c.nota)}</span>`:"");
  const taller=c.taller&&c.ubic!=="entregado"?`<span class="tag taller">📍 ${esc(c.taller)}</span>`:"";
  let pay="";
  if(c.ubic==="entregado"||c.precio){
    pay=`<div class="pay"><span>Entregado: <b>${c.fechaEnt?fdate(c.fechaEnt):"—"}</b></span>${c.taller?`<span>Taller: <b>${esc(c.taller)}</b></span>`:""}
      ${c.precio?`<span>${money(c.precio)} x prenda</span><span>Total: <b>${money(total*c.precio)}</b></span>`:`<span class="falta">Falta cargar el precio</span>`}</div>`;
  }
  return `<article class="card">
    <div class="row1"><div><div class="prod">${esc(c.producto)}</div>${c.clienteNombre?`<div class="meta">Cliente: <b>${esc(c.clienteNombre)}</b></div>`:""}<div class="meta">Cortado ${fdate(c.fecha)} · <b>${total}</b> prendas</div></div>
      <div class="btncol"><button class="edit" type="button" data-edit="${c.id}">Editar</button>${C.conCliente||C.libre?`<button class="edit" type="button" data-ctl="${c.id}">✓ Control</button>`:""}</div></div>
    ${(C.conCliente||C.libre)&&(c.check||[]).length?(()=>{const p=progreso(c);return `<div class="meta">Controladas: <b>${p.ok}/${p.tot}</b></div>`})():""}
    ${lines?`<div class="lines">${lines}</div>`:""}
    <div class="row2"><select class="ubic u-${c.ubic}" id="u-${c.id}" data-ubic="${c.id}" aria-label="Dónde está">${ops}</select>${taller}${obs}</div>
    ${pay}
    ${(()=>{const k=costos(c);if(!k.hay)return "";return `<div class="cost"><span>Costo <b>${money(k.total)}</b> <small>(${money(k.porPrenda)} c/u)</small></span>${k.venta?`<span>Venta <b>${money(k.venta)}</b></span><span class="${k.gan<0?"neg":"pos"}">Ganancia <b>${money(k.gan)}</b> ${pct(k.gan,k.venta)}</span>`:`<span class="meta">Falta cargar la venta</span>`}</div>`})()}
  </article>`;
}
/* ---------- control por color ---------- */
const SW={amarillo:"#F4C20D",naranja:"#F28C28",turquesa:"#1BB5B0",azul:"#1F4FBF",celeste:"#7CC3EE",bordo:"#7A1F2B",rojo:"#D62828",negra:"#1A1A1A",negro:"#1A1A1A",violeta:"#7B3FB5",rosa:"#F07EAA","verde manzana":"#8CC63F",verde:"#1E8E3E",blanco:"#FFFFFF",blanca:"#FFFFFF",gris:"#9AA3AD",marron:"#7B4A2A"};
const T_ORD=["2","4","6","8","10","12","14","16","S","M","L","XL","XXL","XXXL","XXXXL"];
function splitColor(t){const p=String(t||"").trim().split(/\s+/);if(p.length<2)return {color:"Sin color",talle:p[0]||""};return {color:p.slice(0,-1).join(" "),talle:p[p.length-1]}}
function gruposColor(c){
  const g=[],idx={};
  (c.lineas||[]).forEach((l,i)=>{if(!l.t&&!l.c)return;const {color,talle}=splitColor(l.t);const k=norm(color);
    if(!(k in idx)){idx[k]=g.length;g.push({color,items:[]})}g[idx[k]].items.push({i,talle,c:+l.c||0,t:l.t})});
  g.forEach(x=>x.items.sort((a,b)=>{const ia=T_ORD.indexOf(String(a.talle).toUpperCase()),ib=T_ORD.indexOf(String(b.talle).toUpperCase());return (ia<0?99:ia)-(ib<0?99:ib)}));
  return g;
}
function progreso(c){const chk=new Set(c.check||[]);let tot=0,ok=0;(c.lineas||[]).forEach(l=>{tot+=+l.c||0;if(chk.has(l.t))ok+=+l.c||0});return {tot,ok}}
function abrirControl(id){
  const c=cortes.find(x=>x.id===id);if(!c)return;
  let chk=new Set(c.check||[]);
  const pintar=()=>{
    const gs=gruposColor(c);let tot=0,ok=0;
    const html=gs.map(g=>{const gt=g.items.reduce((a,x)=>a+x.c,0),go=g.items.filter(x=>chk.has(x.t)).reduce((a,x)=>a+x.c,0);tot+=gt;ok+=go;
      const sw=SW[norm(g.color)]||"var(--celeste)";const done=go===gt&&gt>0;
      return `<section class="cgroup ${done?"done":""}"><header><span class="sw" style="background:${sw}"></span><b>${esc(g.color)}</b><span class="cnt">${go}/${gt}</span><button type="button" class="lnk2" data-all="${esc(norm(g.color))}">${done?"Destildar":"Tildar todo"}</button></header>
        ${g.items.map(x=>`<label class="citem ${chk.has(x.t)?"on":""}"><input type="checkbox" data-ck="${x.i}" ${chk.has(x.t)?"checked":""}><span class="ct">T ${esc(x.talle)}</span><span class="cq">× ${x.c}</span></label>`).join("")}</section>`}).join("");
    $("#cbody").innerHTML=html;$("#cprog").innerHTML=`<b>${ok}</b> de <b>${tot}</b> prendas controladas<div class="bar2"><i style="width:${tot?Math.round(ok/tot*100):0}%"></i></div>`;
  };
  $("#modal").innerHTML=`<div class="scrim" id="scrim"><div class="panel" id="fctl">
    <h2>Control por color</h2><div class="meta">${esc(c.clienteNombre||CLIENTES[c.cliente].nombre)} · ${esc(c.producto)}</div>
    <div class="cprog" id="cprog"></div><div id="cbody" class="cbody"></div>
    <div class="actions"><span class="meta" id="cmsg">Se guarda solo al tildar.</span><div class="r"><button type="button" class="btn" id="cclose">Listo</button></div></div></div></div>`;
  pintar();
  let t=null;
  const save=()=>{clearTimeout(t);t=setTimeout(async()=>{const {id:_,...data}=cortes.find(x=>x.id===id)||c;data.check=[...chk];
    try{await guardar("cortes",id,data);$("#cmsg").textContent="Guardado ✓"}catch(e){$("#cmsg").textContent="No se pudo guardar. Probá de nuevo."}},500)};
  $("#fctl").addEventListener("change",e=>{const i=e.target.dataset.ck;if(i===undefined)return;const tt=c.lineas[+i].t;e.target.checked?chk.add(tt):chk.delete(tt);c.check=[...chk];pintar();save()});
  $("#fctl").addEventListener("click",e=>{const a=e.target.dataset.all;if(a!==undefined){const g=gruposColor(c).find(x=>norm(x.color)===a);if(!g)return;const all=g.items.every(x=>chk.has(x.t));g.items.forEach(x=>all?chk.delete(x.t):chk.add(x.t));c.check=[...chk];pintar();save()}
    if(e.target.id==="cclose")cerrar()});
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")cerrar()});
}
/* ---------- costos ---------- */
const GASTOS=["Bordado","Ojales","Taller (otro pago)","Tela","Cuellos / puños","Avíos (botones, etiquetas)","Estampado","Flete / otros"];
function costos(c){
  const n=qty(c), tal=n*(+c.precio||0), gs=(c.gastos||[]).reduce((a,g)=>a+(+g.cant||0)*(+g.pu||0),0);
  const total=tal+gs, venta=+c.ventaTotal||n*(+c.ventaPu||0);
  return {n,tal,gs,total,venta,gan:venta-total,porPrenda:n?total/n:0,hay:!!(gs||venta||(c.tizada&&c.tizada.metros))};
}
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"";
/* ---------- formulario de corte ---------- */
function abrirCorte(id){
  const C0=CLIENTES[state.cliente];
  const c=id?cortes.find(x=>x.id===id):{cliente:state.cliente,fecha:today(),producto:C0.productos[0]||"",clienteNombre:"",lineas:[{t:"",c:""}],obs:"Sin pendientes",nota:"",ubic:"nuestro",taller:"Nuestro taller",fechaEnt:"",precio:""};
  if(!c)return;
  const C=CLIENTES[c.cliente];
  const m=$("#modal");
  m.innerHTML=`<div class="scrim" id="scrim"><form class="panel" id="fcorte" novalidate>
    <h2>${id?"Editar corte":"Nuevo corte"} · ${C.nombre}</h2>
    <div class="two"><div class="f"><label for="ffecha">Fecha de corte</label><input type="date" id="ffecha" value="${esc(c.fecha)}"></div>
    <div class="f"><label for="fprod">Producto</label>${C.libre?`<input id="fprod" list="lprods" value="${esc(c.producto)}" placeholder="Escribí el producto"><datalist id="lprods">${usados(c.cliente).map(p=>`<option value="${esc(p)}">`).join("")}</datalist>`:`<select id="fprod">${C.productos.concat(C.productos.includes(c.producto)?[]:[c.producto]).map(p=>`<option ${p===c.producto?"selected":""}>${esc(p)}</option>`).join("")}</select>`}</div></div>
    ${C.conCliente?`<div class="f"><label for="fcli">Cliente</label><input id="fcli" value="${esc(c.clienteNombre)}" placeholder="Ej: Egresados 6to B, Juan Pérez"></div>`:""}
    <div class="flabel">${C.det} y cantidad</div>
    <div id="flineas" style="margin-top:6px"></div>
    <button type="button" class="addl" id="addl">＋ Agregar otro ${C.det.toLowerCase()}</button>
    <div class="meta" id="ftot" style="margin:4px 0 12px"></div>
    <div class="two"><div class="f"><label for="fubic">¿Dónde está?</label><select id="fubic">${UBIC.map(([k,v])=>`<option value="${k}" ${k===c.ubic?"selected":""}>${v}</option>`).join("")}</select></div>
    <div class="f"><label for="ftaller" id="ftlab">¿Cuál?</label><select id="ftaller">${tallerOpts(c.ubic,c.taller)}</select><input id="ftotro" placeholder="Escribí el nombre" hidden></div></div>
    <datalist id="ltalles">${TALLES.map(t=>`<option value="${t}">`).join("")}</datalist>
    <div class="two"><div class="f"><label for="fobs">Observaciones</label><select id="fobs">${OBS.map(o=>`<option ${o===c.obs?"selected":""}>${o}</option>`).join("")}</select></div>
    <div class="f"><label for="fnota">Nota (opcional)</label><input id="fnota" value="${esc(c.nota)}" placeholder="Ej: faltan 6 cuellos T10"></div></div>
    <div class="box"><div class="two"><div class="f"><label for="ffent">Fecha que se entregó</label><input type="date" id="ffent" value="${esc(c.fechaEnt)}"></div>
    <div class="f"><label for="fprecio">Pagamos x prenda ($)</label><input type="number" inputmode="numeric" min="0" id="fprecio" value="${esc(c.precio)}" placeholder="0"></div></div>
    <div>Total a pagar: <span class="total" id="fpagar">$ 0</span></div></div>
    <details class="costbox" id="fcost" ${costos(c).hay?"open":""}><summary>💰 Costos y venta</summary>
      <div class="flabel" style="margin-top:10px">Gastos del pedido</div>
      <p class="meta" style="margin:2px 0 8px">Lo que pagaste aparte del taller: bordado, ojales, tela, cuellos… Poné cantidad y precio por unidad.</p>
      <div id="fgastos"></div>
      <button type="button" class="addl" id="addg">＋ Agregar gasto</button>
      <div class="flabel" style="margin-top:12px">Tizada (opcional)</div>
      <div class="three"><div class="f"><label for="ftzm">Metros de tela</label><input type="number" inputmode="decimal" min="0" step="0.1" id="ftzm" value="${esc(c.tizada?.metros||"")}" placeholder="Ej: 5"></div>
      <div class="f"><label for="ftzp">Prendas que entraron</label><input type="number" inputmode="numeric" min="0" id="ftzp" value="${esc(c.tizada?.prendas||"")}" placeholder="Ej: 12"></div>
      <div class="f"><label for="ftzn">Talles / nota</label><input id="ftzn" value="${esc(c.tizada?.nota||"")}" placeholder="Ej: T8 a T14"></div></div>
      <div class="meta" id="ftzr"></div>
      <div class="flabel" style="margin-top:12px">Venta</div>
      <div class="two"><div class="f"><label for="fvpu">Vendido a ($ x prenda)</label><input type="number" inputmode="numeric" min="0" id="fvpu" value="${esc(c.ventaPu||"")}" placeholder="0"></div>

    return {k,nombre,niv:nivelDe(nombre),rows}}).filter(p=>p.rows.length&&pasa(p.nombre));
  const all=P.flatMap(p=>p.rows),S=f=>all.reduce((a,r)=>a+r[f],0);
  const NV=[["todos","Todos"],["jar","Jardín"],["pri","Primaria"],["sec","Secundaria"],["gen","Otros"]];

  h+=`<div class="nivs" role="group" aria-label="Nivel">${NV.map(([k,v])=>`<button type="button" class="nivb niv-${k}" data-niv="${k}" aria-pressed="${k===niv}">${v}</button>`).join("")}</div>`;

  h+=`<p class="meta" style="margin:8px 0 0">La librería se descuenta sola con cada venta que se carga en la planilla. “Feb–abr” es lo que se vendió de febrero a abril de 2026: es tu parámetro de cuántas tenés que tener.</p>`;

  const cards=P.map(p=>{const s=f=>p.rows.reduce((a,r)=>a+r[f],0),pf=p.rows.reduce((a,r)=>a+Math.max(0,r.temp-r.hay),0);
    return `<div class="sprod niv-${p.niv}"><div class="phead"><span class="pn">${esc(p.nombre)}</span><span class="pnums">Tengo <b>${s("hay")}</b>${hayLib?` · <span class="pm">${money(s("$li")+s("$tal")+s("$co"))}</span>`:""}${hayTemp&&s("temp")?` · feb–abr <b>${s("temp")}</b>${pf?` <span class="pill bad">faltan ${pf}</span>`:` <span class="pill good">✓</span>`}`:""}</span></div>

      p.rows.map(r=>`<tr><td><b>${esc(r.t)}</b></td><td class="${!hayLib?"soft":r.li<=0?"neg":r.li<=2?"low":""}">${hayLib?r.li:"—"}</td><td class="${r.tal<0?"neg":r.tal?"":"soft"}">${r.tal||"·"}</td><td class="${r.co?"corte":"soft"}">${r.co||"·"}</td><td><b>${r.hay}</b></td><td class="par">${r.temp||"·"}</td>${est(r.hay,r.temp)}</tr>`).join("")}

let paraLlevar=[];
function movList(){
  const movs=salidas.filter(s=>s.cliente===state.cliente).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(a.creado||0)).slice(0,80);
  if(!movs.length)return "";
  const rem=conMajo()?remitosLib():[];
  const remHtml=rem.length?`<div class="salidas"><h2>Remitos a la librería</h2>${rem.slice().reverse().slice(0,40).map(r=>`<div class="srow"><span><b>N° ${String(r.n).padStart(4,"0")}</b> · ${fdate(r.s.fecha)} · ${movLineas(r.s).reduce((a,l)=>a+(+l.c||0),0)} prendas</span><button type="button" class="lnk2" data-rjpg="${r.s.id}">📄 Descargar JPG</button></div>`).join("")}</div>`:"";
  return remHtml+`<div class="salidas"><h2>Movimientos</h2>${movs.map(s=>{const ls=movLineas(s),n=ls.reduce((a,l)=>a+(+l.c||0),0),tp=tipoDe(s);
    const txt=tp==="entrega"?`Entregué a <b>${esc(s.destino||"—")}</b>`:tp==="ingreso"?"Sumé stock al taller":tp==="majo"?"Llevé a la librería":"Venta";
    return `<div class="mov"><div class="mhead"><span><b>${fdate(s.fecha)}</b> · ${txt}</span><span class="${tp==="ingreso"?"plus":"minus"}">${tp==="ingreso"?"+":tp==="majo"?"→":"−"}${n} prendas</span></div>
      <div class="lines">${ls.map(l=>`<span class="chip">${esc(l.p)} · T <b>${esc(l.t)}</b> · ${esc(l.c)}</span>`).join("")}</div>
      <div class="mfoot"><span class="meta">${esc(s.nota||"")}${s.planilla?` · anotado en planilla (col. ${esc(s.planilla)})`:""}</span><span style="display:flex;gap:14px;align-items:center">${tp==="majo"&&conMajo()?`<button type="button" class="lnk2" data-rjpg="${s.id}">📄 Remito</button>`:""}<span id="dm-${s.id}"><button type="button" class="lnk" data-delask="${s.id}" data-maj="${tp==="majo"?1:""}">Borrar</button></span></span></div></div>`}).join("")}</div>`;
}

async function jpgRemitoLib(s,n){
  try{await document.fonts.ready;await LOGO.decode()}catch(_){}
  const items=movLineas(s).map(l=>({p:l.p,t:l.t,c:+l.c||0})).sort((a,b)=>a.p.localeCompare(b.p)||tOrder(a.t)-tOrder(b.t));
  const total=items.reduce((a,l)=>a+l.c,0),rowH=56,W=1080;
  const H=330+70+items.length*rowH+110+(s.nota?60:0)+200;
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const AZ="#1D5BB5",CE="#E1EFFB",INK="#0F2440",MU="#5B7290",FD='"Archivo",Arial,sans-serif',FB='"Figtree",Arial,sans-serif';
  const T=(str,X,Y,f,col,al)=>{x.font=f;x.fillStyle=col||INK;x.textAlign=al||"left";x.fillText(str,X,Y)};
  x.fillStyle="#fff";x.fillRect(0,0,W,H);x.textBaseline="middle";
  try{const lh=190,lw=lh*LOGO.naturalWidth/LOGO.naturalHeight;x.drawImage(LOGO,60,20,lw,lh)}catch(_){}
  T("REMITO",W-60,70,`800 52px ${FD}`,AZ,"right");
  T(`N° ${String(n).padStart(4,"0")}`,W-60,125,`700 30px ${FB}`,AZ,"right");
  T(`Fecha: ${fdate(s.fecha)}`,W-60,170,`600 26px ${FB}`,INK,"right");
  x.fillStyle=AZ;x.fillRect(0,228,W,8);
  T("Para:",60,280,`500 26px ${FB}`,MU);T("Librería — Majo",140,280,`700 30px ${FB}`);
  T("Uniformes Colegio Fátima",W-60,280,`500 24px ${FB}`,MU,"right");
  let y=330;x.fillStyle=AZ;x.fillRect(60,y,W-120,60);
  T("Producto",80,y+30,`700 22px ${FB}`,"#fff");T("Talle",700,y+30,`700 22px ${FB}`,"#fff","center");T("Cantidad",W-80,y+30,`700 22px ${FB}`,"#fff","right");
  y+=60;items.forEach((l,i)=>{if(i%2){x.fillStyle=CE;x.fillRect(60,y,W-120,rowH)}const cy=y+rowH/2;
    T(l.p,80,cy,`500 25px ${FB}`);T(String(l.t),700,cy,`700 25px ${FB}`,INK,"center");T(String(l.c),W-80,cy,`600 25px ${FB}`,INK,"right");y+=rowH});
  x.strokeStyle=AZ;x.lineWidth=2;x.beginPath();x.moveTo(60,y);x.lineTo(W-60,y);x.stroke();
  y+=20;x.fillStyle=CE;x.fillRect(60,y,W-120,70);T("TOTAL DE PRENDAS",80,y+35,`800 28px ${FD}`,AZ);T(String(total),W-80,y+35,`800 34px ${FD}`,AZ,"right");
  y+=110;if(s.nota){T("Nota: "+s.nota,60,y,`italic 500 22px ${FB}`,MU);y+=60}
  x.strokeStyle=MU;x.lineWidth=1.5;[[60,460],[W-460,W-60]].forEach(([a,b])=>{x.beginPath();x.moveTo(a,y+70);x.lineTo(b,y+70);x.stroke()});
  T("Entregó — Uniforma",60,y+100,`500 20px ${FB}`,MU);T("Recibió — Librería",W-460,y+100,`500 20px ${FB}`,MU);
  T("Uniforma · Uniformes & Egresados · IG @uniforma.ind",W/2,H-30,`500 18px ${FB}`,MU,"center");
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.92));
  const nombre=`Remito ${String(n).padStart(4,"0")} Libreria ${fdate(s.fecha).replaceAll("/","-")}.jpg`;
  if(downloads){try{await downloads.save({filename:nombre,data:blob});setSync("Remito descargado ✓");return}catch(e){if(e&&e.code==="declined")return}}
  $("#modal").innerHTML=`<div class="scrim" id="scrim"><div class="panel" style="text-align:center"><h2>Remito N° ${String(n).padStart(4,"0")}</h2><p class="meta">Mantené apretada la imagen para guardarla o compartirla.</p><img src="${URL.createObjectURL(blob)}" alt="Remito a la librería" style="width:100%;border:1px solid var(--line);border-radius:10px"><div class="actions"><span></span><button type="button" class="btn" id="cancel">Cerrar</button></div></div></div>`;
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim"||e.target.id==="cancel")cerrar()});
}

/* escribe lo llevado a la librería como REPO en la hoja STOCK */
async function anotarRepo(fecha,ls,idMov){
  if(!mcp)throw {code:"nomcp"};
  const r=await mcp.callTool(GS,"sumar_repo",{fecha,lineas:ls,idMov},{cache:false});
  return r.payload.letra;
}

function abrirSalida(tipo,pre){
  const C=CLIENTES[state.cliente], M=conMajo();
  const titulos={ingreso:M?"Sumar stock al taller":"Sumar stock",majo:"Llevar a la librería",entrega:"Entrega"};
  const extra=tipo==="entrega"?`<div class="f"><label for="sdest">¿A quién?</label><input id="sdest" list="ldest" value="${state.cliente==="tecnica"?"Técnica":""}"><datalist id="ldest"><option value="Técnica"><option value="Venta directa"></datalist></div>`:`<span></span>`;
  const ayuda={ingreso:"Para cargar prendas que ya tenías en el taller antes de usar la app, o corregir después de contar.",majo:"Se resta del taller y se anota sola como reposición en tu planilla, así se suma al stock de la librería.",entrega:"Se resta del stock del taller."}[tipo];
  let lineas=pre&&pre.length?pre.map(l=>({p:C.productos.find(x=>hojaKey(x)===l.k)||C.productos[0],t:l.t,c:l.c})):[{p:C.productos[0],t:"",c:""}];
  $("#modal").innerHTML=`<div class="scrim" id="scrim"><form class="panel" id="fsal" novalidate>
    <h2>${titulos[tipo]} · ${C.nombre}</h2><p class="meta" style="margin:-6px 0 12px">${ayuda}</p>
    <div class="two"><div class="f"><label for="sfecha">Fecha</label><input type="date" id="sfecha" value="${today()}"></div>${extra}</div>
    <div class="flabel">Prendas</div><div id="slineas" style="margin-top:6px"></div>
    <button type="button" class="addl" id="saddl">＋ Agregar otra prenda</button>
    <div class="meta" id="stot" style="margin:4px 0 12px"></div>
    <datalist id="ltalles2">${TALLES.map(t=>`<option value="${t}">`).join("")}</datalist>
    <div class="f"><label for="snota">Nota (opcional)</label><input id="snota" placeholder="Opcional"></div>
    <div class="actions"><span></span><div class="r"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button type="submit" class="btn" id="sok">Guardar</button></div></div>
  </form></div>`;
  const pintar=()=>{$("#slineas").innerHTML=lineas.map((l,i)=>`<div class="lrow3"><select id="sp${i}" data-i="${i}" data-k="p" aria-label="Producto">${C.productos.map(p=>`<option ${p===l.p?"selected":""}>${esc(p)}</option>`).join("")}</select><input id="st${i}" data-i="${i}" data-k="t" list="ltalles2" placeholder="Talle" value="${esc(l.t)}" aria-label="Talle"><input id="sc${i}" data-i="${i}" data-k="c" type="number" inputmode="numeric" min="0" placeholder="Cant." value="${esc(l.c)}" aria-label="Cantidad"><button type="button" data-srm="${i}" aria-label="Quitar">×</button></div>`).join("");calc()};
  const msg=(t,bad)=>{$("#stot").textContent=t;$("#stot").style.color=bad?"var(--danger)":""};
  const calc=()=>msg(`Total: ${lineas.reduce((a,l)=>a+(+l.c||0),0)} prendas`);
  pintar();
  const f=$("#fsal");
  f.addEventListener("input",e=>{const d=e.target.dataset;if(d.k){lineas[+d.i][d.k]=e.target.value;calc()}});
  f.addEventListener("change",e=>{const d=e.target.dataset;if(d.k)lineas[+d.i][d.k]=e.target.value});
  f.addEventListener("click",e=>{
    if(e.target.dataset.srm!==undefined){lineas.splice(+e.target.dataset.srm,1);if(!lineas.length)lineas.push({p:C.productos[0],t:"",c:""});pintar()}
    if(e.target.id==="saddl"){const last=lineas[lineas.length-1];lineas.push({p:last.p,t:"",c:""});pintar();$("#st"+(lineas.length-1)).focus()}
    if(e.target.id==="cancel")cerrar();
  });
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")cerrar()});
  let enviando=false;
  f.addEventListener("submit",async e=>{
    e.preventDefault();if(enviando)return;
    const ls=lineas.filter(l=>String(l.t).trim()&&+l.c>0).map(l=>({p:l.p,t:String(l.t).trim(),c:+l.c}));
    if(!ls.length)return msg("Cargá al menos una prenda con talle y cantidad.",true);
    const d={cliente:state.cliente,tipo,fecha:$("#sfecha").value||today(),lineas:ls,nota:$("#snota").value.trim(),creado:Date.now()};
    if(tipo==="ingreso")d.lugar="taller";
    if(tipo==="entrega")d.destino=$("#sdest").value.trim();
    if(tipo==="majo"){
      d.destino="Librería (Majo)";enviando=true;$("#sok").disabled=true;msg("Anotando en tu planilla…");
      try{d.idMov=d.idMov||("r"+Date.now().toString(36)+Math.random().toString(36).slice(2,8));d.planilla=await anotarRepo(d.fecha,ls,d.idMov)}
      catch(err){enviando=false;$("#sok").disabled=false;
        const c=err&&err.code;
        msg(c==="nomatch"||c==="nocol"?err.message:c==="server_not_connected"?"Google Sheets no está conectado (claude.ai → Configuración → Conectores).":c==="needs_reauth"?"Hay que volver a conectar Google Sheets.":c==="not_in_manifest"||c==="approval_required"?"Falta tu permiso para escribir en la planilla. Tocá Guardar de nuevo y aceptá.":c==="nomcp"?"Esta vista no puede conectarse con Google Sheets.":"No se pudo anotar en la planilla. Revisá la planilla antes de volver a intentar, por si quedó anotado.",true);return}
    }
    cerrar();
    try{await guardar("salidas",null,d);setSync(tipo==="majo"?(d.planilla==="pendiente"?"Guardado ✓ Se anota en la planilla cuando vuelva la señal":"Guardado y anotado en la planilla ✓"):"Guardado ✓")}catch(err){setSync("No se pudo guardar en la app. Probá de nuevo.")}
    if(tipo==="majo"&&conMajo()){const n=remitosLib().length||1;jpgRemitoLib(d,n)}
    if(tipo==="majo")cargarLib();
  });
}
function usados(cl){return [...new Set(cortes.filter(c=>c.cliente===cl&&c.producto).map(c=>c.producto))].sort()}
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
function renderBalance(){
  const meses=new Set([today().slice(0,7)]);
  cortes.forEach(c=>{if(c.fecha)meses.add(c.fecha.slice(0,7));if(c.fechaEnt)meses.add(c.fechaEnt.slice(0,7))});
  const lista=[...meses].sort().reverse();
  if(!state.mes||!lista.includes(state.mes))state.mes=lista[0];
  const m=state.mes, nm=k=>MESES[+k.slice(5)-1]+" "+k.slice(0,4);
  let h=`<div class="bar"><div class="f" style="margin:0;min-width:200px"><label for="bmes">Mes</label><select id="bmes" data-mes="1">${lista.map(k=>`<option value="${k}" ${k===m?"selected":""}>${nm(k)}</option>`).join("")}</select></div></div>`;
  const cort=cortes.filter(c=>(c.fecha||"").startsWith(m)), ent=cortes.filter(c=>c.ubic==="entregado"&&(c.fechaEnt||"").startsWith(m));
  const tq=a=>a.reduce((x,c)=>x+qty(c),0), tp=a=>a.reduce((x,c)=>x+qty(c)*(+c.precio||0),0);
  h+=`<div class="stats"><div class="stat"><small>Prendas cortadas</small><b>${tq(cort)}</b></div><div class="stat"><small>Cortes</small><b>${cort.length}</b></div><div class="stat"><small>Prendas entregadas</small><b>${tq(ent)}</b></div><div class="stat"><small>Pagado a talleres</small><b>${money(tp(ent))}</b></div></div>`;
  h+=`<div class="tblwrap"><table class="tbl"><thead><tr><th>Cliente</th><th>Cortes</th><th>Cortado</th><th>Entregado</th><th>Pagado</th></tr></thead><tbody>${Object.entries(CLIENTES).map(([k,v])=>{const a=cort.filter(c=>c.cliente===k),b=ent.filter(c=>c.cliente===k);return `<tr><td>${v.nombre}</td><td>${a.length}</td><td>${tq(a)}</td><td>${tq(b)}</td><td>${money(tp(b))}</td></tr>`}).join("")}</tbody></table></div>`;
  const porProd={};cort.forEach(c=>{const k=CLIENTES[c.cliente].nombre+" · "+c.producto;porProd[k]=(porProd[k]||0)+qty(c)});
  const ks=Object.keys(porProd).sort();
  h+=`<div class="salidas"><h2>Lo que se cortó en ${nm(m)}</h2>${ks.length?`<div class="tblwrap"><table class="tbl"><tbody>${ks.map(k=>`<tr><td>${esc(k)}</td><td>${porProd[k]} prendas</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No hay cortes cargados con fecha de este mes.</div>`}</div>`;
  const porT={};ent.forEach(c=>{const k=c.taller||"Sin taller";porT[k]=(porT[k]||0)+qty(c)*(+c.precio||0)});
  const ts=Object.keys(porT).sort();
  if(ts.length)h+=`<div class="salidas"><h2>Pagado por taller</h2><div class="tblwrap"><table class="tbl"><tbody>${ts.map(k=>`<tr><td>${esc(k)}</td><td>${money(porT[k])}</td></tr>`).join("")}</tbody></table></div></div>`;
  return h;
}
/* ---------- copia de respaldo ---------- */
let downloads=null;
const UB=Object.fromEntries(UBIC);
function lastBackup(){try{return +localStorage.getItem("cu-backup")||0}catch(e){return 0}}
function backupNote(){
  const d=lastBackup(),dias=d?Math.floor((Date.now()-d)/864e5):null;
  $("#backupNote").innerHTML=(cortes.length||salidas.length)&&(d===0||dias>=15)?`<div class="sheetbar"><span>${d?`Tu última copia de Excel fue hace ${dias} días.`:"Todavía no descargaste ninguna copia de Excel."} Conviene bajar una cada 15 días.</span></div>`:"";
}
async function descargarCopia(){
  const btn=$("#btnCopia");
  if(typeof XLSX==="undefined"){setSync("No se pudo preparar el Excel. Recargá la página.");return}
  if(!downloads){setSync("Esta vista no permite descargar archivos.");return}
  btn.disabled=true;setSync("Preparando copia…");
  try{
    const c1=[["Cliente","Pedido de","Fecha corte","Producto","Talle / color","Cantidad","Dónde está","Taller / lugar","Observación","Nota","Fecha entregado","Pagado x prenda","Subtotal","ID corte"]];
    cortes.slice().sort((a,b)=>(a.cliente||"").localeCompare(b.cliente||"")||(a.fecha||"").localeCompare(b.fecha||"")).forEach(c=>(c.lineas&&c.lineas.length?c.lineas:[{t:"",c:0}]).forEach(l=>
      c1.push([(CLIENTES[c.cliente]||{}).nombre||c.cliente,c.clienteNombre||"",fdate(c.fecha),c.producto,l.t,+l.c||0,UB[c.ubic]||c.ubic,c.taller||"",c.obs||"",c.nota||"",fdate(c.fechaEnt),+c.precio||0,(+l.c||0)*(+c.precio||0),c.id])));
    const c2=[["Cliente","Fecha","Movimiento","Destino / lugar","Producto","Talle","Cantidad","Nota","Anotado en planilla (col.)"]];
    const TX={ingreso:"Sumé stock",majo:"Llevé a la librería",entrega:"Entrega",venta:"Venta"};
    salidas.slice().sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")).forEach(m=>movLineas(m).forEach(l=>
      c2.push([(CLIENTES[m.cliente]||{}).nombre||m.cliente,fdate(m.fecha),TX[tipoDe(m)]||m.tipo,m.destino||(m.lugar==="majo"?"Librería":m.tipo==="ingreso"?"Taller":""),l.p,l.t,+l.c||0,m.nota||"",m.planilla||""])));
    const c3=[["Cliente","Producto","Talle","En el taller"]];
    const prev=state.cliente;
    for(const k of ["fatima","tecnica"]){state.cliente=k;const st=calcTaller(cortes.filter(c=>c.cliente===k));
      Object.keys(st).forEach(p=>sortT(Object.keys(st[p])).forEach(t=>{const o=st[p][t];if(o.taller)c3.push([CLIENTES[k].nombre,o.nombre||p,t,o.taller])}))}
    state.cliente=prev;
    const c4=[["Cliente","Pedido de","Producto","Fecha corte","Prendas","Taller $","Gastos $","Costo total $","Costo x prenda $","Venta $","Ganancia $","Tizada m","Tizada prendas","Detalle de gastos"]];
    cortes.forEach(c=>{const k=costos(c);if(!k.hay&&!c.precio)return;
      c4.push([(CLIENTES[c.cliente]||{}).nombre||c.cliente,c.clienteNombre||"",c.producto,fdate(c.fecha),k.n,k.tal,k.gs,k.total,Math.round(k.porPrenda),k.venta,k.venta?k.gan:"",c.tizada?.metros||"",c.tizada?.prendas||"",(c.gastos||[]).map(g=>`${g.tipo}${g.det?" ("+g.det+")":""}: ${g.cant} x $${g.pu}`).join(" | ")])});
    const wb=XLSX.utils.book_new();
    [["Cortes",c1,[14,18,11,24,16,9,22,20,22,26,13,13,12,18]],["Movimientos de stock",c2,[12,11,18,16,24,8,9,24,12]],["Stock taller",c3,[12,26,8,12]],["Costos y ganancia",c4,[14,18,24,11,9,12,12,13,13,12,12,9,10,60]]].forEach(([n,a,w])=>{
      const ws=XLSX.utils.aoa_to_sheet(a);ws["!cols"]=w.map(x=>({wch:x}));ws["!autofilter"]={ref:ws["!ref"]};XLSX.utils.book_append_sheet(wb,ws,n)});
    const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
    const f=today().split("-").reverse().join("-");
    await downloads.save({filename:`Copia Cortes Uniforma ${f}.xlsx`,data:new Blob([buf])});
    try{localStorage.setItem("cu-backup",String(Date.now()))}catch(e){}
    setSync("Copia descargada ✓");backupNote();
  }catch(e){setSync(e&&e.code==="declined"?"Descarga cancelada":"No se pudo descargar la copia")}
  finally{btn.disabled=false}
}
function cerrar(){$("#modal").innerHTML=""}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.c){state.cliente=t.dataset.c;saveUI();render();if(t.dataset.c==="tecnica")leerTecStock()}
  else if(t.dataset.v){state.vista=t.dataset.v;saveUI();render()}
  else if(t.dataset.edit)abrirCorte(t.dataset.edit);
  else if(t.dataset.ctl)abrirControl(t.dataset.ctl);
  else if(t.id==="fab")abrirCorte(null);
  else if(t.dataset.mov)abrirSalida(t.dataset.mov);
  else if(t.dataset.niv){state.niv=t.dataset.niv;saveUI();render()}
  else if(t.dataset.libtab){state.libTab=t.dataset.libtab;saveUI();render()}
  else if(t.dataset.open!==undefined){const s=new Set(state.open||[]),k=t.dataset.open;s.has(k)?s.delete(k):s.add(k);state.open=[...s];saveUI();render();aplicarBusqueda()}
  else if(t.dataset.prep){state.prepOpen=!state.prepOpen;saveUI();render()}
  else if(t.dataset.llevar)abrirSalida("majo",paraLlevar);
  else if(t.id==="reLib")cargarLib();
  else if(t.dataset.rjpg){const r=remitosLib().find(x=>x.s.id===t.dataset.rjpg);if(r)jpgRemitoLib(r.s,r.n)}
  else if(t.id==="reTec")leerTecStock();
  else if(t.id==="btnCopia")descargarCopia();
  else if(t.dataset.delask){$("#dm-"+t.dataset.delask).innerHTML=`<span class="confirm">${t.dataset.maj?"Esto no lo saca de la planilla: corregilo también ahí. ":""}¿Borrar? <button type="button" class="lnk danger" data-delsal="${t.dataset.delask}">Sí, borrar</button></span>`}
  else if(t.dataset.delsal){borrar("salidas",t.dataset.delsal).catch(()=>setSync("No se pudo borrar"))}
});
function aplicarBusqueda(){const q=norm(state.bus||"");document.querySelectorAll("#sgrid .sprod").forEach(el=>{const n=el.querySelector(".pn,h3");el.hidden=!!q&&!!n&&!norm(n.textContent).includes(q)})}
document.addEventListener("input",e=>{if(e.target.id!=="fbus")return;state.bus=e.target.value;aplicarBusqueda()});
document.addEventListener("change",async e=>{
  if(e.target.dataset.mes){state.mes=e.target.value;render();return}
  const id=e.target.dataset.ubic;if(!id)return;
  const c=cortes.find(x=>x.id===id);if(!c)return;
  const {id:_,...data}=c;data.ubic=e.target.value;
  if(data.ubic==="entregado"&&!data.fechaEnt)data.fechaEnt=today();
  if(data.ubic!=="entregado"&&!lugaresDe(data.ubic).includes(data.taller))data.taller=data.ubic==="nuestro"?"Nuestro taller":"";
  cortes=cortes.map(x=>x.id===id?{...data,id}:x);
  try{await guardar("cortes",id,data);setSync("Guardado ✓");
    if((data.ubic==="entregado"&&!data.precio)||(["taller","bordado","ojales"].includes(data.ubic)&&!data.taller))setTimeout(()=>abrirCorte(id),50)}catch(err){setSync("No se pudo guardar")}
});
render();

/* ---------- conexión ---------- */
(async()=>{
  try{db=await window.claude?.use?.("db")}catch(e){db=null}
  try{mcp=await window.claude?.use?.("mcp")}catch(e){mcp=null}
  window.claude?.use?.("downloads").then(d=>{downloads=d;if(!d)$("#btnCopia").hidden=true}).catch(()=>{$("#btnCopia").hidden=true});
  cargarLib();setInterval(()=>{if(!document.hidden&&state.cliente==="fatima"&&state.vista==="stock")cargarLib()},300000);
  if(!db){offline=true;setSync("Sin conexión al guardado");render();return}
  const err=e=>{setSync("Se cortó la conexión. Recargá la página.")};
  db.collection("cortes").onSnapshot(s=>{cortes=s.docs.map(d=>({...d.data(),id:d.id}));setSync("Todo guardado");render();backupNote();if(!s.metadata?.fromCache)syncTecnica()},err);
  leerTecStock();
  db.collection("salidas").onSnapshot(s=>{salidas=s.docs.map(d=>({...d.data(),id:d.id}));render();if(abrirLib){abrirLib=false;abrirSalida("majo")}},err);
})();
</script>
